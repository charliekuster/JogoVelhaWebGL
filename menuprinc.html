<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOGO DA VELHA 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-image: url('assets/img/a.jpg');
            color: white;

        }

        .menu-container {
            width: 600px;
            margin: 150px auto;
            padding: 25px;
            background: #0f37528a;
            border-radius: 30px;
            box-shadow: 0 0 10px rgba(8, 8, 8, 0.2);
        }

        h1 {
            font-size: 30px;
        }

        .avatar-selection {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 10px 0;
        }

        .avatar-container {
            width: 160px;
            height: 210px;
            border-radius: 20px;
            background: #222b34;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 8px solid transparent;
            transition: 0.3s;
        }

        .avatar-container.selected {
            border: 2px solid rgb(0, 129, 101);
        }

        .start-button {
            background: #ecf776;
            border: #212121;
            padding: 15px 20px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }

        .start-button:hover {
            background: #bc00a9;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <h1>JOGO DA VELHA 3D</h1>
        <p>Escolha o seu avatar para começar:</p>
        <div class="avatar-selection">
            <div class="avatar-container" id="avatarX" data-player="X"></div>
            <div class="avatar-container" id="avatarO" data-player="O"></div>
        </div>
        <button class="start-button" id="startButton" disabled>Iniciar Jogo</button>

        <script>
          document.getElementById('startButton').addEventListener('click', function() {
            window.location.href = 'index.html'; 
          });
        </script>
    </div>

    <script src="avatarmenu.js"></script>
    
</body>
</html>
